<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Выбор организационно-правовой формы бизнеса</title>
    <style>
        :root {
            --bg: #f3f5fa;
            --card: #fff;
            --tx: #17202e;
            --mu: #5f6d80;
            --bd: #dfe4ee;
            --ac: #4f46e5;
            --acs: #eceaff;
            --ok: #16874d;
            --no: #c0392b;
            --hero1: #4f46e5;
            --hero2: #0ea5e9;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f131b;
                --card: #181e29;
                --tx: #e9edf5;
                --mu: #97a4b8;
                --bd: #2a3342;
                --ac: #8b85ff;
                --acs: #262452;
                --ok: #4cc382;
                --no: #ff8a80;
                --hero1: #3730a3;
                --hero2: #0369a1
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f131b;
            --card: #181e29;
            --tx: #e9edf5;
            --mu: #97a4b8;
            --bd: #2a3342;
            --ac: #8b85ff;
            --acs: #262452;
            --ok: #4cc382;
            --no: #ff8a80;
            --hero1: #3730a3;
            --hero2: #0369a1
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        .hero {
            background: linear-gradient(135deg, var(--hero1), var(--hero2));
            color: #fff;
            padding: 36px 16px 70px
        }

        .in {
            max-width: 960px;
            margin: 0 auto
        }

        .hero h1 {
            font-size: clamp(1.6rem, 4vw, 2.3rem);
            margin: 8px 0
        }

        .hero p {
            margin: 0;
            max-width: 620px;
            opacity: .92
        }

        .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px
        }

        .tags span {
            background: rgba(255, 255, 255, .18);
            border-radius: 99px;
            padding: 3px 12px;
            font-size: .85rem
        }

        main {
            max-width: 960px;
            margin: -44px auto 0;
            padding: 0 16px 48px
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 28px rgba(20, 30, 60, .08);
            margin-bottom: 18px
        }

        .q {
            padding: 14px 0;
            border-bottom: 1px dashed var(--bd)
        }

        .q:last-of-type {
            border: 0
        }

        .q h3 {
            margin: 0 0 10px;
            font-size: 1rem;
            display: flex;
            gap: 10px;
            align-items: center
        }

        .q h3 b {
            flex: none;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--ac);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: .8rem
        }

        :root:not([data-theme="light"]) .q h3 b {
            color: #0f131b
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .chip {
            border: 1.5px solid var(--bd);
            background: var(--bg);
            color: var(--tx);
            border-radius: 12px;
            padding: 8px 14px;
            font: inherit;
            font-size: .92rem;
            cursor: pointer;
            text-align: left
        }

        .chip small {
            display: block;
            color: var(--mu);
            font-size: .76rem
        }

        .chip.on {
            border-color: var(--ac);
            background: var(--acs);
            font-weight: 600
        }

        .go {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--hero1), var(--hero2));
            color: #fff;
            font: 700 1.05rem inherit;
            font-family: inherit;
            cursor: pointer
        }

        .top {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap
        }

        .badge {
            display: inline-block;
            background: var(--ok);
            color: #fff;
            border-radius: 99px;
            padding: 2px 12px;
            font-size: .78rem;
            font-weight: 700
        }

        :root:not([data-theme="light"]) .badge {
            color: #0f131b
        }

        .top h2 {
            margin: 6px 0 2px;
            font-size: 1.4rem
        }

        .law {
            font-size: .82rem;
            color: var(--mu)
        }

        h4 {
            margin: 20px 0 8px;
            font-size: .78rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--mu)
        }

        .facts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px
        }

        .fact {
            background: var(--bg);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: .9rem
        }

        .fact span {
            display: block;
            font-size: .74rem;
            color: var(--mu);
            margin-bottom: 2px
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        @media(max-width:640px) {
            .two {
                grid-template-columns: 1fr
            }
        }

        .box {
            border-radius: 12px;
            padding: 12px 14px;
            border: 1px solid var(--bd)
        }

        .box h4 {
            margin: 0 0 4px
        }

        ul {
            padding-left: 20px;
            margin: .3em 0
        }

        .pro li::marker {
            color: var(--ok)
        }

        .con li::marker {
            color: var(--no)
        }

        .alert {
            background: var(--acs);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 12px;
            font-size: .92rem
        }

        .bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 7px 0;
            font-size: .92rem
        }

        .bar .n {
            width: 130px;
            flex: none
        }

        .bar .t {
            flex: 1;
            height: 10px;
            background: var(--bd);
            border-radius: 6px;
            overflow: hidden
        }

        .bar .t i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--hero1), var(--hero2))
        }

        .bar.x {
            color: var(--mu);
            align-items: flex-start
        }

        .bar.x .n {
            font-weight: 600
        }

        .note {
            font-size: .82rem;
            color: var(--mu);
            text-align: center
        }

        [hidden] {
            display: none
        }
    </style>
</head>

<body>
    <header class="hero">
        <div class="in">
            <div style="font-size:.85rem;opacity:.85">Предприятие — основное звено экономики</div>
            <h1>Какую форму бизнеса выбрать?</h1>
            <p>Ответьте на пять вопросов — и получите рекомендацию по организационно-правовой форме с учётом
                законодательства РФ.</p>
            <div class="tags"><span>Самозанятый</span><span>ИП</span><span>ООО</span><span>АО</span></div>
        </div>
    </header>
    <main>
        <div class="panel">
            <div id="qs"></div><button class="go" id="go">Подобрать форму</button>
        </div>
        <div id="out" hidden></div>
    </main>
    <script>
        var Q = [
            { k: "act", t: "Вид деятельности", d: "serv", o: [["trade", "Торговля"], ["serv", "Услуги"], ["prod", "Производство"], ["it", "IT и цифровые продукты"], ["food", "Общепит"]] },
            { k: "scale", t: "Масштаб бизнеса", d: "small", o: [["micro", "Микро", "до 2,4 млн ₽/год, без сотрудников"], ["small", "Малый", "до 800 млн ₽/год"], ["mid", "Средний", "до 2 млрд ₽/год"], ["large", "Крупный", "свыше 2 млрд ₽/год"]] },
            { k: "fnd", t: "Количество учредителей", d: "1", o: [["1", "Один"], ["2", "2–5"], ["6", "6–50"], ["51", "Более 50"]] },
            { k: "inv", t: "Привлечение инвестиций", d: "none", o: [["none", "Не планируется"], ["loan", "Только кредиты и займы"], ["partner", "Инвесторы в капитал"], ["public", "Публичное размещение акций"]] },
            { k: "lia", t: "Ответственность учредителей", d: "pref", o: [["ok", "Готов отвечать всем имуществом"], ["pref", "Желательно ограничить"], ["must", "Обязательно ограничить"]] }];
        var V = {};
        var F = {
            npd: { n: "Самозанятый (НПД)", law: "Закон № 422-ФЗ (налог на профессиональный доход)", d: "Специальный налоговый режим для физических лиц без регистрации ИП или компании. Подходит для небольших проектов в одиночку.", f: [["Учредители", "1 человек"], ["Уставный капитал", "не нужен"], ["Ответственность", "всем личным имуществом"], ["Налоги", "4% с дохода от физлиц, 6% от организаций и ИП"], ["Инвестиции", "не предусмотрены"], ["Регистрация", "онлайн, через приложение"]], p: ["Налог только с полученного дохода", "Регистрация за несколько минут", "Почти нет отчётности и бухгалтерии"], c: ["Лимит дохода 2,4 млн ₽ в год", "Нельзя нанимать сотрудников и перепродавать товары", "Ответственность всем имуществом"] },
            ip: { n: "Индивидуальный предприниматель (ИП)", law: "Закон № 129-ФЗ, глава 26.2 НК РФ (УСН)", d: "Физическое лицо, зарегистрированное как предприниматель. Простая форма для малого бизнеса с одним владельцем.", f: [["Учредители", "1 человек"], ["Уставный капитал", "не нужен"], ["Ответственность", "всем личным имуществом"], ["Налоги", "УСН, патент, ОСНО; прибыль выводится без налога на дивиденды"], ["Инвестиции", "только займы и кредиты"], ["Регистрация", "3 рабочих дня"]], p: ["Быстрая и недорогая регистрация", "Упрощённый учёт, доступны УСН и патент", "Свободно распоряжаться прибылью"], c: ["Отвечает по долгам всем личным имуществом", "Нельзя привлечь соинвесторов в долю", "Сложнее продать бизнес"] },
            ooo: { n: "Общество с ограниченной ответственностью (ООО)", law: "Закон № 14-ФЗ, ст. 87–90 ГК РФ", d: "Самая популярная форма юридического лица: капитал разделён на доли, участники рискуют только своим вкладом.", f: [["Учредители", "от 1 до 50"], ["Уставный капитал", "от 10 000 ₽ (деньгами)"], ["Ответственность", "в пределах стоимости доли; риск субсидиарной при банкротстве"], ["Налоги", "УСН, ОСНО; дивиденды облагаются НДФЛ 13–15%"], ["Инвестиции", "доля в капитале, облигации"], ["Регистрация", "3 рабочих дня"]], p: ["Ограниченная ответственность участников", "Можно принять инвесторов и разделить бизнес", "Удобно продавать долю, выше доверие контрагентов"], c: ["Нужны устав и уставный капитал", "Обязательная бухгалтерская отчётность", "Вывод прибыли через дивиденды с НДФЛ"] },
            ao: { n: "Акционерное общество (АО)", law: "Закон № 208-ФЗ, ст. 96–104 ГК РФ", d: "Юридическое лицо, капитал которого разделён на акции. Подходит для крупных проектов и привлечения широкого круга инвесторов.", f: [["Учредители", "1 и более"], ["Уставный капитал", "НАО от 10 000 ₽, ПАО от 100 000 ₽"], ["Ответственность", "в пределах стоимости акций; риск субсидиарной"], ["Налоги", "УСН (при соблюдении лимитов), ОСНО; НДФЛ с дивидендов"], ["Инвестиции", "акции (в ПАО — открытая подписка), облигации"], ["Регистрация", "3 рабочих дня; выпуск акций регистрируется в Банке России"]], p: ["Выпуск акций и облигаций", "Легко менять состав акционеров", "Ограниченная ответственность и высокий статус"], c: ["Самая сложная и дорогая форма управления", "Реестр акционеров, регистрация выпуска акций", "Раскрытие отчётности (для ПАО — публично)"] }
        };
        function calc(v) {
            var s = { npd: 0, ip: 0, ooo: 0, ao: 0 }, x = {}, r = [];
            function ex(k, m) { if (!x[k]) x[k] = m } function add(k, n) { s[k] += n } var f = +v.fnd;
            if (f > 1) { ex("npd", "только один человек"); ex("ip", "ИП — всегда один человек") } else { add("ip", 1); add("npd", 1) }
            if (f >= 51) { ex("ooo", "в ООО не более 50 участников (иначе в течение года нужно преобразоваться в АО или кооператив)"); add("ao", 3) }
            else if (f >= 6) { add("ooo", 1); add("ao", 2) } else if (f >= 2) add("ooo", 2);
            if (v.lia == "ok") { add("ip", 1); add("npd", 1) }
            else if (v.lia == "pref") { add("ooo", 2); add("ao", 1); add("ip", -1) }
            else { ex("npd", "отвечает всем имуществом"); ex("ip", "отвечает всем имуществом"); add("ooo", 2); add("ao", 1) }
            if (v.inv == "none") { add("ip", 1); add("npd", 1) }
            else if (v.inv == "loan") { add("ip", 1); add("ooo", 1) }
            else if (v.inv == "partner") { ex("npd", "нельзя принять инвестора"); ex("ip", "нельзя принять инвестора в долю"); add("ooo", 3); add("ao", 1) }
            else { ex("npd", "публичное размещение невозможно"); ex("ip", "публичное размещение невозможно"); ex("ooo", "публичное размещение акций доступно только ПАО"); add("ao", 4) }
            if (v.scale == "micro") { add("npd", 4); add("ip", 2) }
            else if (v.scale == "small") { ex("npd", "превышен лимит НПД 2,4 млн ₽ в год"); add("ip", 2); add("ooo", 2) }
            else if (v.scale == "mid") { ex("npd", "превышен лимит НПД"); add("ip", -1); add("ooo", 3); add("ao", 1) }
            else { ex("npd", "превышен лимит НПД"); ex("ip", "не подходит по масштабу"); add("ooo", 1); add("ao", 3) }
            var a = v.act;
            if (a == "trade") { ex("npd", "нельзя перепродавать товары"); add("ip", 1); add("ooo", 1) }
            else if (a == "prod") { add("npd", -1); add("ip", 1); add("ooo", 2) }
            else if (a == "serv") { add("npd", 1); add("ip", 1) }
            else if (a == "it") { add("npd", 1); add("ip", 1); add("ooo", 1) }
            else { add("ip", 1); add("ooo", 1); r.push("Для розничной продажи алкоголя нужна организация (ООО или АО).") }
            var ok = Object.keys(s).filter(function (k) { return !x[k] }).sort(function (a, b) { return s[b] - s[a] });
            return { s: s, x: x, ok: ok, r: r }
        }
        function li(a) { return a.map(function (t) { return "<li>" + t + "</li>" }).join("") }
        function render() {
            var R = calc(V), o = document.getElementById("out");
            if (!R.ok.length) { o.innerHTML = '<div class="panel">Для такого сочетания нет подходящей формы из четырёх. Измените условия.</div>'; o.hidden = false; return }
            var b = R.ok[0], A = F[b], max = Math.max.apply(null, R.ok.map(function (k) { return R.s[k] })) || 1;
            var w = [V.lia == "ok" ? "вы готовы отвечать своим имуществом" : "важна ограниченная ответственность", { 1: "один учредитель", 2: "несколько учредителей", 6: "большая группа учредителей", 51: "очень много учредителей" }[V.fnd], { none: "внешние инвестиции не нужны", loan: "достаточно кредитов и займов", partner: "нужны инвесторы в капитале", public: "нужно публичное размещение" }[V.inv], "масштаб: " + { micro: "микро", small: "малый", mid: "средний", large: "крупный" }[V.scale]];
            var al = R.r.slice();
            if (b == "ao") al.push(V.inv == "public" ? "Вам нужно ПАО: уставный капитал от 100 000 ₽, публичное раскрытие отчётности." : "Достаточно непубличного АО (НАО): капитал от 10 000 ₽, акции только среди определённого круга лиц.");
            var h = '<div class="panel"><div class="top"><div><span class="badge">Рекомендация</span><h2>' + A.n + '</h2><div class="law">' + A.law + '</div></div></div><p>' + A.d + '</p><p><b>Почему она:</b> ' + w.join("; ") + '.</p>' + al.map(function (t) { return '<div class="alert">' + t + '</div>' }).join("") + '<h4>Ключевые параметры</h4><div class="facts">' + A.f.map(function (x) { return '<div class="fact"><span>' + x[0] + '</span>' + x[1] + '</div>' }).join("") + '</div><div class="two" style="margin-top:18px"><div class="box"><h4>Преимущества</h4><ul class="pro">' + li(A.p) + '</ul></div><div class="box"><h4>Ограничения</h4><ul class="con">' + li(A.c) + '</ul></div></div></div>';
            h += '<div class="panel"><h4 style="margin-top:0">Рейтинг вариантов</h4>';
            R.ok.forEach(function (k) { var p = Math.max(8, Math.round(R.s[k] / max * 100)); h += '<div class="bar"><span class="n">' + F[k].n.replace(/ \(.*\)/, "") + '</span><span class="t"><i style="width:' + p + '%"></i></span><span>' + p + '%</span></div>' });
            var ek = Object.keys(R.x); if (ek.length) { h += '<h4>Не подходят</h4>'; ek.forEach(function (k) { h += '<div class="bar x"><span class="n">' + F[k].n.replace(/ \(.*\)/, "") + '</span><span>' + R.x[k] + '</span></div>' }) }
            o.innerHTML = h + '</div>'; o.hidden = false; o.scrollIntoView({ behavior: "smooth", block: "start" })
        }
        var qs = document.getElementById("qs");
        Q.forEach(function (q, i) {
            V[q.k] = q.d; var d = document.createElement("div"); d.className = "q";
            d.innerHTML = '<h3><b>' + (i + 1) + '</b>' + q.t + '</h3><div class="chips"></div>'; var c = d.lastChild;
            q.o.forEach(function (o) {
                var bt = document.createElement("button"); bt.type = "button"; bt.className = "chip" + (o[0] == q.d ? " on" : ""); bt.innerHTML = o[1] + (o[2] ? "<small>" + o[2] + "</small>" : "");
                bt.onclick = function () { V[q.k] = o[0];[].forEach.call(c.children, function (x) { x.classList.remove("on") }); bt.classList.add("on") }; c.appendChild(bt)
            }); qs.appendChild(d)
        });
        document.getElementById("go").addEventListener("click", render);
    </script>
</body>

</html>
